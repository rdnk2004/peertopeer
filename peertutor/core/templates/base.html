{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerTutor - Micro-Tutoring Marketplace</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>
    <nav>
        <a href="{% url 'home' %}" class="logo">PeerTutor</a>
        <div>
            <a href="{% url 'home' %}">Find Tutors</a>
            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard ({{ user.username }})</a>
            <a href="{% url 'logout' %}">Logout</a>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}" class="btn">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
