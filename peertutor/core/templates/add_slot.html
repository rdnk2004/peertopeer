{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 520px; margin: 2.5rem auto;">
    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
        <div style="font-size: 1.6rem;">📅</div>
        <div>
            <h2>Publish Available Time Slot</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.15rem;">
                Offer a dedicated tutoring window for students to book with escrow protection.
            </p>
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_subject">Tutoring Subject / Topic</label>
            <input type="text" id="id_subject" name="subject" list="subject_suggestions" placeholder="e.g. Python, Calculus I, Organic Chemistry" required>
            <datalist id="subject_suggestions">
                <option value="Python Programming">
                <option value="Data Structures & Algorithms">
                <option value="Calculus I & II">
                <option value="Linear Algebra">
                <option value="Web Development (HTML/CSS/JS)">
                <option value="Physics: Mechanics">
            </datalist>
            <small style="color: var(--text-subtle); font-size: 0.8rem; display: block; margin-top: 0.3rem;">
                Specify the exact topic or general subject you will cover during this slot.
            </small>
        </div>

        <div class="form-group">
            <label for="id_date">Session Date</label>
            <input type="date" id="id_date" name="date" required>
        </div>

        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="id_start_time">Start Time</label>
                <input type="time" id="id_start_time" name="start_time" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="id_end_time">End Time</label>
                <input type="time" id="id_end_time" name="end_time" required>
            </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
            <button type="submit" class="btn btn-success" style="flex: 1;">+ Publish Slot</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary" style="text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
