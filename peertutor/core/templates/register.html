{% extends 'base.html' %}
{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon-circle">✨</div>
        <h2>Create an Account</h2>
        <p>Join the verified peer micro-tutoring network</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username / Full Name</label>
            <input type="text" id="id_username" name="username" placeholder="e.g. AlexChen" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="id_email">University / Student Email</label>
            <input type="email" id="id_email" name="email" placeholder="alex@university.edu" required autocomplete="email">
        </div>

        <div class="form-group">
            <label for="id_password">Create Password</label>
            <input type="password" id="id_password" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
        </div>

        <div class="form-group">
            <label>I want to register as a:</label>
            <div class="role-selector-grid">
                <label class="role-option-card">
                    <input type="radio" name="role" value="student" checked onchange="updateRoleSelection(this)">
                    <span class="role-title">🎓 Student</span>
                    <span class="role-desc">Book sessions & learn from peers</span>
                </label>
                <label class="role-option-card">
                    <input type="radio" name="role" value="tutor" onchange="updateRoleSelection(this)">
                    <span class="role-title">👨‍🏫 Peer Tutor</span>
                    <span class="role-desc">Teach subjects & earn money</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-success" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.75rem;">
            Create Account & Get Started →
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
        Already have an account?
        <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Log in here</a>
    </div>
</div>

<script>
    function updateRoleSelection() {
        document.querySelectorAll('.role-option-card').forEach(card => {
            const radio = card.querySelector('input[type="radio"]');
            if (radio && radio.checked) {
                card.classList.add('is-selected');
            } else {
                card.classList.remove('is-selected');
            }
        });
    }
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', updateRoleSelection);
</script>
{% endblock %}
