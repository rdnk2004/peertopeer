{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 2rem auto;">
    <h2 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; margin-bottom: 1rem;">
        ⭐ Review {{ role_label }}: {{ target_user.username }}
    </h2>
    <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">
        Session: <strong>{{ booking.slot.subject }}</strong> on {{ booking.slot.date }}
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Rating (1 to 5 Stars)</label>
            <select name="rating" required style="padding: 0.6rem; border-radius: 6px; border: 1px solid #cbd5e1; width: 100%;">
                <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
                <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                <option value="3">⭐⭐⭐ (3 - Good)</option>
                <option value="2">⭐⭐ (2 - Fair)</option>
                <option value="1">⭐ (1 - Poor)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Feedback & Review Comment</label>
            <textarea name="comment" rows="4" required placeholder="Share your experience working together..." style="padding: 0.6rem; border-radius: 6px; border: 1px solid #cbd5e1; width: 100%;"></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%; font-size: 1rem;">Submit {{ role_label }} Review</button>
    </form>
</div>
{% endblock %}
